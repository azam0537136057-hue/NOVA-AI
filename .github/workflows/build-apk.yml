name: Build NOVA AI APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Extract NOVA AI
        run: |
          unzip -q NOVA_AI.zip -d nova_project

      - name: Find project
        run: |
          PROJECT_DIR=$(dirname "$(find nova_project -name settings.gradle -o -name settings.gradle.kts | head -1)")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Enable AndroidX
        run: |
          echo "android.useAndroidX=true" > "$PROJECT_DIR/gradle.properties"
          echo "android.enableJetifier=true" >> "$PROJECT_DIR/gradle.properties"

      - name: Fix Material 3 references
        run: |
          grep -RIl 'android:style/Theme.Material3' "$PROJECT_DIR/app" 2>/dev/null | while read file; do
            sed -i 's/@android:style\/Theme.Material3/@style\/Theme.Material3/g' "$file"
            sed -i 's/android:style\/Theme.Material3/style\/Theme.Material3/g' "$file"
          done

      - name: Add Material library
        run: |
          APP_GRADLE=$(find "$PROJECT_DIR/app" -maxdepth 1 -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) | head -1)

          if [[ "$APP_GRADLE" == *.kts ]]; then
            grep -q 'com.google.android.material:material' "$APP_GRADLE" || \
            sed -i '/dependencies {/a\    implementation("com.google.android.material:material:1.12.0")' "$APP_GRADLE"
          else
            grep -q 'com.google.android.material:material' "$APP_GRADLE" || \
            sed -i '/dependencies {/a\    implementation "com.google.android.material:material:1.12.0"' "$APP_GRADLE"
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-AI-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/**/*.apk
