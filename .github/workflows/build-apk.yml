name: Build NOVA AI APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Extract NOVA AI
        run: |
          unzip -q NOVA_AI.zip -d nova_project
          echo "Searching for Gradle project..."
          find nova_project -name settings.gradle -o -name settings.gradle.kts

      - name: Find project directory
        run: |
          PROJECT_DIR=$(dirname "$(find nova_project -name settings.gradle -o -name settings.gradle.kts | head -1)")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project found at: $PROJECT_DIR"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-AI-APK
          path: ${{ env.PROJECT_DIR }}/**/build/outputs/apk/**/*.apk
