name: Build NOVA AI APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Extract NOVA AI
        run: |
          unzip -q NOVA_AI.zip -d nova_project

      - name: Enable AndroidX
        run: |
          echo "android.useAndroidX=true" >> nova_project/NOVA_AI/gradle.properties
          echo "android.enableJetifier=true" >> nova_project/NOVA_AI/gradle.properties

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Add Material dependency
        run: |
          echo "Adding Material dependency..."
          sed -i '/dependencies {/a\    implementation "com.google.android.material:material:1.12.0"' nova_project/NOVA_AI/app/build.gradle

      - name: Build APK
        working-directory: nova_project/NOVA_AI
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-AI-APK
          path: nova_project/NOVA_AI/**/build/outputs/apk/**/*.apk
